<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thu Hoạch Vườn Xoài</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 12px 24px;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .header-title h1 { font-size: 24px; color: #2e7d32; display: flex; align-items: center; gap: 8px; }
    .header-title p { font-size: 15px; color: #666; font-weight: 600; }
    .progress-pill {
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 800;
      font-size: 18px;
      padding: 6px 18px;
      border-radius: 30px;
      border: 2px solid #81c784;
    }

    .game-container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: auto 0;
    }

    /* Khung bài toán phép tính trực quan bằng quả xoài */
    .visual-equation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      width: 100%;
      background: #fafafa;
      border-radius: 24px;
      padding: 16px 14px;
      border: 2px solid #e0e0e0;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
    }

    .mango-plate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 20px;
      min-height: 100px;
      min-width: 90px;
      flex-wrap: wrap;
      transition: all 0.3s;
    }
    .plate-yellow {
      background: linear-gradient(180deg, #fffde7 0%, #fff9c4 100%);
      border: 3px dashed #fbc02d;
      box-shadow: 0 4px 10px rgba(251, 192, 45, 0.25);
    }
    .plate-green {
      background: linear-gradient(180deg, #e8f5e9 0%, #c8e6c9 100%);
      border: 3px dashed #43a047;
      box-shadow: 0 4px 10px rgba(67, 160, 71, 0.25);
    }

    .math-operator {
      font-size: 46px;
      font-weight: 900;
      color: #1b5e20;
      padding: 0 4px;
    }

    .mango-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .mango-svg {
      width: 58px;
      height: 76px;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15));
      transition: transform 0.2s;
    }
    .mango-svg:hover { transform: scale(1.1) rotate(-5deg); }

    .guide-text {
      font-size: 19px;
      color: #555;
      font-weight: 700;
      min-height: 32px;
      text-align: center;
      transition: all 0.3s;
    }
    .answer-box {
      min-width: 75px;
      height: 75px;
      border: 4px dashed #ff9800;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff8e1;
      color: #e65100;
      font-size: 48px;
      transition: all 0.3s;
    }
    .answer-box.filled {
      border: 4px solid #4caf50;
      background: #e8f5e9;
      color: #2e7d32;
      animation: popSuccess 0.4s ease;
    }

    /* Các nút chọn số */
    .options-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      width: 100%;
    }
    .opt-btn {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #42a5f5, #1e88e5);
      color: #ffffff;
      font-size: 42px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(30, 136, 229, 0.35);
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .opt-btn:active { transform: scale(0.92); }
    .opt-btn.wrong {
      background: linear-gradient(135deg, #ef5350, #d32f2f);
      animation: shake 0.4s ease-in-out;
    }

    /* Màn hình tổng kết quy luật */
    #summary-view {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .summary-table {
      width: 100%;
      max-width: 650px;
      background: #f9fbe7;
      border-radius: 20px;
      padding: 16px;
      border: 2px solid #dce775;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      background: #ffffff;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .btn-action {
      padding: 14px 34px;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      background: #43a047;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(67, 160, 71, 0.3);
      transition: 0.2s;
    }
    .btn-action:hover { background: #2e7d32; }

    @keyframes bounceIn {
      from { transform: scale(0.3); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes popSuccess {
      0% { transform: scale(0.7); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    canvas#confetti { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 999; }

    /* Tối ưu hiển thị Responsive trên Tablet & Điện thoại di động */
    @media (max-width: 768px) {
      body {
        padding: 10px 8px;
      }
      header {
        padding: 10px 16px;
        border-radius: 16px;
      }
      .header-title h1 {
        font-size: 20px;
      }
      .header-title p {
        font-size: 13px;
      }
      .progress-pill {
        font-size: 15px;
        padding: 4px 14px;
      }
      .game-container {
        padding: 16px 12px;
        border-radius: 22px;
        gap: 16px;
      }
      .visual-equation {
        gap: 8px;
        padding: 12px 8px;
      }
      .mango-plate {
        padding: 8px 10px;
        min-height: 80px;
        min-width: 65px;
        gap: 4px;
      }
      .mango-svg {
        width: 44px;
        height: 58px;
      }
      .math-operator {
        font-size: 32px;
      }
      .guide-text {
        font-size: 16px;
      }
      .answer-box {
        min-width: 58px;
        height: 58px;
        font-size: 36px;
        border-radius: 14px;
        border-width: 3px;
      }
      .options-row {
        gap: 14px;
      }
      .opt-btn {
        width: 76px;
        height: 76px;
        font-size: 36px;
        border-radius: 18px;
      }
      .summary-table {
        padding: 12px;
      }
      .summary-row {
        font-size: 17px;
        padding: 8px 12px;
      }
      .btn-action {
        font-size: 17px;
        padding: 12px 26px;
      }
    }

    @media (max-width: 420px) {
      .header-title h1 {
        font-size: 17px;
      }
      .header-title p {
        font-size: 12px;
      }
      .progress-pill {
        font-size: 13px;
        padding: 4px 10px;
      }
      .mango-svg {
        width: 45px;
        height: 60px;
      }
      .equation-bar {
        font-size: 30px;
        gap: 8px;
      }
      .answer-box {
        min-width: 50px;
        height: 50px;
        font-size: 32px;
      }
      .options-row {
        gap: 10px;
      }
      .opt-btn {
        width: 68px;
        height: 68px;
        font-size: 32px;
        border-radius: 16px;
      }
      .summary-row {
        font-size: 15px;
        flex-direction: column;
        gap: 4px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1 style="color: #e6c014; font-size: 30px;">LUYỆN TẬP</h1>
      <h4 style="color: #2e7d32; font-size: 26px;"> SỐ ?</h4>
      <!-- <p>Quan sát số xoài chín (vàng) và xoài xanh để điền số đúng!</p> -->
    </div>
    <div class="progress-pill" id="progress-text">Câu 1 / 5</div>
  </header>

  <div class="game-container">
    <!-- Khu vực chơi từng câu -->
    <div id="play-view" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;">
      
      <!-- Phép tính trực quan: quả xoài vàng + quả xoài xanh = ? -->
      <div class="visual-equation">
        <div class="mango-plate plate-yellow" id="yellow-mangoes" title="Số xoài vàng"></div>
        <span class="math-operator">+</span>
        <div class="mango-plate plate-green" id="green-mangoes" title="Số xoài xanh"></div>
        <span class="math-operator">=</span>
        <div class="answer-box" id="answer-box">?</div>
      </div>

      <p class="guide-text" id="guide-text">Đếm số xoài vàng và xoài xanh rồi chọn số thích hợp thay cho dấu "?"</p>
      <div class="options-row" id="options-container"></div>
    </div>

    <!-- Màn hình tổng kết quy luật toàn bài -->
    <div id="summary-view">
      <div style="font-size: 48px;">🎉 🏆 🥭</div>
      <h2 style="color: #2e7d32; font-size: 26px;">XUẤT SẮC! EM ĐÃ HOÀN THÀNH BÀI TẬP</h2>
      <!-- <p style="font-size: 17px; color: #444; text-align: center;">
        Các con hãy quan sát: <b>Dù số xoài vàng giảm đi và xoài xanh tăng lên</b>, tổng số xoài trên mỗi cành luôn luôn là <b>6</b>!
      </p> -->
      
      <div class="summary-table" id="summary-table-content"></div>

      <button class="btn-action" onclick="resetGame()">Luyện tập lại vòng mới</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    // Dữ liệu 5 bài toán theo đúng hình ảnh sách giáo khoa
    const QUESTIONS = [
      { yellow: 5, green: 1, result: 6, options: [5, 6, 7] },
      { yellow: 4, green: 2, result: 6, options: [4, 6, 8] },
      { yellow: 3, green: 3, result: 6, options: [6, 7, 5] },
      { yellow: 2, green: 4, result: 6, options: [6, 5, 4] },
      { yellow: 1, green: 5, result: 6, options: [7, 8, 6] }
    ];

    let currentIndex = 0;
    let isProcessing = false;

    // Bộ âm thanh Web Audio Offline
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function soundCorrect() {
      playBeep(523.25, 'sine', 0.1);
      setTimeout(() => playBeep(659.25, 'sine', 0.15), 90);
      setTimeout(() => playBeep(783.99, 'sine', 0.25), 180);
    }
    function soundWrong() {
      playBeep(220, 'sawtooth', 0.15);
      setTimeout(() => playBeep(180, 'sawtooth', 0.2), 100);
    }

    // Tiếng vỗ tay chúc mừng khi hoàn thành
    function playApplauseSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const fanfareNotes = [523.25, 659.25, 783.99, 1046.50, 880, 1046.50];
      const fanfareTimes = [0, 0.14, 0.28, 0.45, 0.7, 0.95];
      fanfareNotes.forEach((freq, idx) => {
        setTimeout(() => playBeep(freq, 'sine', 0.3), fanfareTimes[idx] * 1000);
      });

      const bufferSize = Math.floor(audioCtx.sampleRate * 0.05);
      const clapBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = clapBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const decay = Math.exp(-i / (audioCtx.sampleRate * 0.009));
        data[i] = (Math.random() * 2 - 1) * decay;
      }

      for (let i = 0; i < 80; i++) {
        const delay = Math.pow(Math.random(), 0.75) * 3.2;
        setTimeout(() => {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const source = audioCtx.createBufferSource();
          source.buffer = clapBuffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 900 + Math.random() * 800;
          filter.Q.value = 2.0 + Math.random() * 1.5;

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.12 + Math.random() * 0.22, audioCtx.currentTime);

          source.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          source.start();
        }, delay * 1000);
      }
    }

    // Vẽ quả xoài bằng vector SVG (Vàng hoặc Xanh) với kích thước tùy chỉnh
    function createMangoSVG(colorType, w = null, h = null) {
      const isYellow = colorType === 'yellow';
      const mainColor = isYellow ? '#FFB300' : '#43A047';
      const shadowColor = isYellow ? '#FFA000' : '#2E7D32';
      const leafColor = isYellow ? '#4CAF50' : '#2E7D32';
      const sizeStyle = (w && h) ? `style="width:${w}px; height:${h}px;"` : '';

      return `
        <svg class="mango-svg" ${sizeStyle} viewBox="0 0 100 130">
          <!-- Cuống và lá -->
          <path d="M50 35 C48 20 40 10 32 5 C38 18 45 25 48 35 Z" fill="#6d4c41"/>
          <path d="M52 25 C68 18 80 22 88 12 C82 28 72 32 52 30 Z" fill="${leafColor}"/>
          <!-- Thân quả xoài cong đặc trưng -->
          <path d="M48 32 C72 32 88 55 85 85 C82 112 55 125 35 120 C18 115 12 95 18 70 C24 45 35 32 48 32 Z" 
                fill="${mainColor}" stroke="${shadowColor}" stroke-width="3"/>
          <!-- Vệt sáng 3D -->
          <path d="M30 60 C26 75 28 92 38 102" stroke="rgba(255,255,255,0.45)" stroke-width="5" stroke-linecap="round" fill="none"/>
        </svg>
      `;
    }

    function renderQuestion(index) {
      const q = QUESTIONS[index];
      document.getElementById('progress-text').innerText = `Câu ${index + 1} / ${QUESTIONS.length}`;
      
      const answerBox = document.getElementById('answer-box');
      answerBox.innerText = '?';
      answerBox.className = 'answer-box';

      const guideText = document.getElementById('guide-text');
      guideText.innerHTML = 'Đếm số xoài vàng và xoài xanh rồi chọn số thích hợp thay cho dấu "?"';
      guideText.style.color = '#555';

      // Hiển thị số lượng quả xoài màu vàng (thay cho số)
      const yellowBox = document.getElementById('yellow-mangoes');
      yellowBox.innerHTML = '';
      for (let i = 0; i < q.yellow; i++) {
        const div = document.createElement('div');
        div.className = 'mango-unit';
        div.innerHTML = createMangoSVG('yellow');
        yellowBox.appendChild(div);
      }

      // Hiển thị số lượng quả xoài màu xanh (thay cho số)
      const greenBox = document.getElementById('green-mangoes');
      greenBox.innerHTML = '';
      for (let i = 0; i < q.green; i++) {
        const div = document.createElement('div');
        div.className = 'mango-unit';
        div.innerHTML = createMangoSVG('green');
        greenBox.appendChild(div);
      }

      // Tạo các nút đáp án trắc nghiệm
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      q.options.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = num;
        btn.onclick = () => handleChoice(btn, num, q);
        optsContainer.appendChild(btn);
      });
      isProcessing = false;
    }

    function handleChoice(btn, chosenNum, q) {
      if (isProcessing) return;

      if (chosenNum === q.result) {
        isProcessing = true;
        soundCorrect();
        const answerBox = document.getElementById('answer-box');
        answerBox.innerText = chosenNum;
        answerBox.classList.add('filled');

        // Hiện thông báo củng cố kiến thức
        const guideText = document.getElementById('guide-text');
        guideText.innerHTML = `🎉 Chính xác! <b>${q.yellow}</b> xoài vàng + <b>${q.green}</b> xoài xanh = <b>${q.result}</b> quả xoài!`;
        guideText.style.color = '#2e7d32';

        setTimeout(() => {
          if (currentIndex < QUESTIONS.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
          } else {
            showSummary();
          }
        }, 1200);
      } else {
        soundWrong();
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 450);
      }
    }

    function showSummary() {
      document.getElementById('play-view').style.display = 'none';
      document.getElementById('summary-view').style.display = 'flex';
      document.getElementById('progress-text').innerText = 'Hoàn thành';
      
      const table = document.getElementById('summary-table-content');
      table.innerHTML = '';
      QUESTIONS.forEach(q => {
        const row = document.createElement('div');
        row.className = 'summary-row';

        // Chuỗi quả xoài vàng và xoài xanh thu nhỏ
        let yellowIcons = '';
        for (let i = 0; i < q.yellow; i++) {
          yellowIcons += createMangoSVG('yellow', 24, 32);
        }
        let greenIcons = '';
        for (let i = 0; i < q.green; i++) {
          greenIcons += createMangoSVG('green', 24, 32);
        }

        row.innerHTML = `
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <div style="display: flex; gap:5px;">${yellowIcons}</div>
            <span style="font-weight: 1000; font-size: 30px; color: #2e7d32;">+</span>
            <div style="display: flex; gap: 5px;">${greenIcons}</div>
          </div>
          <span style="color: #2e7d32; font-size: 35px; font-weight: 1000;">${q.yellow} + ${q.green} = 6</span>
        `;
        table.appendChild(row);
      });

      startConfetti();
      playApplauseSound();
    }

    function resetGame() {
      currentIndex = 0;
      document.getElementById('summary-view').style.display = 'none';
      document.getElementById('play-view').style.display = 'flex';
      renderQuestion(0);
    }

    // Hiệu ứng pháo giấy chúc mừng
    function startConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = Array.from({ length: 80 }, () => ({
        x: Math.random() * canvas.width,
        y: -10,
        r: Math.random() * 8 + 4,
        color: ['#ff3d00', '#4caf50', '#ffeb3b', '#29b6f6', '#ab47bc'][Math.floor(Math.random() * 5)],
        tilt: Math.random() * 10,
        tiltAngleInc: Math.random() * 0.07 + 0.05
      }));
      let step = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.tilt = Math.sin(step) * 12;
          p.y += 3.5;
          ctx.beginPath();
          ctx.lineWidth = p.r / 2;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
          ctx.stroke();
        });
        step += 0.04;
        if (pieces[0].y < canvas.height + 40) requestAnimationFrame(draw);
      }
      draw();
    }

    window.onload = () => renderQuestion(0);
  </script>
</body>
</html>
